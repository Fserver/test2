<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Validator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      font-size: 18px;
      text-align: center;
      margin-bottom: 20px;
      color: #667eea;
    }
    
    .language-selector {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #555;
    }
    
    select {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    
    select:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    
    button {
      flex: 1;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button.secondary {
      background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
    }
    
    .results {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .result-item {
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    
    .result-success {
      background: #d4edda;
      color: #155724;
      border-left: 4px solid #28a745;
    }
    
    .result-warning {
      background: #fff3cd;
      color: #856404;
      border-left: 4px solid #ffc107;
    }
    
    .result-error {
      background: #f8d7da;
      color: #721c24;
      border-left: 4px solid #dc3545;
    }
    
    .result-info {
      background: #d1ecf1;
      color: #0c5460;
      border-left: 4px solid #17a2b8;
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }
    
    .stat-box {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
    }
    
    .stat-number {
      font-size: 20px;
      font-weight: bold;
      color: #667eea;
    }
    
    .stat-label {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #667eea;
    }
    
    .hidden {
      display: none;
    }
    
    .issue-item {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    
    .issue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .issue-title {
      font-weight: 600;
      font-size: 13px;
    }
    
    .issue-actions {
      display: flex;
      gap: 5px;
    }
    
    .issue-btn {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-highlight {
      background: #ffc107;
      color: #000;
    }
    
    .btn-highlight:hover {
      background: #ffca2c;
    }
    
    .btn-unhighlight {
      background: #6c757d;
      color: white;
    }
    
    .btn-suggest {
      background: #17a2b8;
      color: white;
    }
    
    .issue-text {
      font-size: 12px;
      color: #555;
      margin-bottom: 5px;
      word-break: break-word;
    }
    
    .issue-meta {
      font-size: 11px;
      color: #888;
    }
    
    .semantic-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      margin-right: 5px;
    }
    
    .badge-language {
      background: #dc3545;
      color: white;
    }
    
    .badge-semantic {
      background: #ffc107;
      color: #000;
    }
    
    .badge-suggestion {
      background: #17a2b8;
      color: white;
    }
    
    .suggestion-box {
      background: #e7f3ff;
      border-left: 3px solid #17a2b8;
      padding: 8px;
      margin-top: 8px;
      font-size: 12px;
    }
    
    .tabs {
      display: flex;
      margin-bottom: 15px;
      border-bottom: 2px solid #eee;
    }
    
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      transition: all 0.2s;
    }
    
    .tab:hover {
      color: #667eea;
    }
    
    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌐 Language Validator</h1>
    
    <div class="language-selector">
      <label for="languageSelect">Seleccionar idioma a validar:</label>
      <select id="languageSelect">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </div>
    
    <div class="button-group">
      <button id="validateBtn">Validar Página</button>
      <button id="clearHighlightsBtn" class="secondary">Quitar Resaltados</button>
    </div>
    
    <div id="loading" class="loading hidden">
      ⏳ Analizando contenido...
    </div>
    
    <div id="results" class="results hidden">
      <div class="stats">
        <div class="stat-box">
          <div class="stat-number" id="totalElements">0</div>
          <div class="stat-label">Analizados</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" id="correctElements">0</div>
          <div class="stat-label">Correctos</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" id="issuesCount">0</div>
          <div class="stat-label">Problemas</div>
        </div>
      </div>
      
      <div class="tabs" style="margin-top: 15px;">
        <div class="tab active" data-tab="language">Idioma</div>
        <div class="tab" data-tab="semantic">Semántica</div>
        <div class="tab" data-tab="suggestions">Sugerencias</div>
      </div>
      
      <div id="languageTab" class="tab-content active"></div>
      <div id="semanticTab" class="tab-content"></div>
      <div id="suggestionsTab" class="tab-content"></div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
